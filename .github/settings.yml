# Repository settings managed via the Probot Settings app
# (https://probot.github.io/apps/settings/). These take effect only if the
# app is installed on this repository; otherwise this file documents the
# intended configuration.

repository:
  # Only allow squash merging pull requests
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false

branches:
  - name: main
    protection:
      # Block force pushes to main. Admins are exempt because the rules
      # are not enforced on them.
      allow_force_pushes: false
      allow_deletions: false
      enforce_admins: false
