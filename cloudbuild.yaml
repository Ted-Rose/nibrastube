# One-off / manual image build with NEXT_PUBLIC_* build args inlined
# (the GitHub Actions workflow builds with plain `docker build`; this file
# exists so `gcloud builds submit` can do the same without a local daemon):
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --project <PROJECT_ID> \
#     --substitutions=_IMAGE=<REGION>-docker.pkg.dev/<PROJECT_ID>/nibrastube/nibrastube:latest,\
#_NEXT_PUBLIC_PUSHER_KEY=...,_NEXT_PUBLIC_PUSHER_CLUSTER=eu,_NEXT_PUBLIC_SENTRY_DSN=...,\
#_NEXT_PUBLIC_SENTRY_RELEASE=$(git rev-parse HEAD)
#
# .env must NOT be uploaded: it is excluded by .dockerignore for the docker
# build context and by .gitignore for the gcloud source upload.
substitutions:
  _IMAGE: europe-west1-docker.pkg.dev/nibrastube-app/nibrastube/nibrastube:latest
  _NEXT_PUBLIC_PUSHER_KEY: ""
  _NEXT_PUBLIC_PUSHER_CLUSTER: ""
  _NEXT_PUBLIC_SENTRY_DSN: ""
  # This file only builds the production Cloud Run image, so the
  # environment default is production; pass the checkout's commit
  # sha as _NEXT_PUBLIC_SENTRY_RELEASE ("" = no release tag).
  _NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
  _NEXT_PUBLIC_SENTRY_RELEASE: ""
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform=linux/amd64
      - --build-arg=NEXT_PUBLIC_PUSHER_KEY=${_NEXT_PUBLIC_PUSHER_KEY}
      - --build-arg=NEXT_PUBLIC_PUSHER_CLUSTER=${_NEXT_PUBLIC_PUSHER_CLUSTER}
      - --build-arg=NEXT_PUBLIC_SENTRY_DSN=${_NEXT_PUBLIC_SENTRY_DSN}
      - --build-arg=NEXT_PUBLIC_SENTRY_ENVIRONMENT=${_NEXT_PUBLIC_SENTRY_ENVIRONMENT}
      - --build-arg=NEXT_PUBLIC_SENTRY_RELEASE=${_NEXT_PUBLIC_SENTRY_RELEASE}
      - --tag=${_IMAGE}
      - .
images:
  - "${_IMAGE}"
options:
  machineType: E2_HIGHCPU_8
