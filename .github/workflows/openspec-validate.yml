name: OpenSpec validate

# Runs `openspec validate --all --strict` from the repo root on every
# pull request and every push to `main` (plus manual dispatch), so
# spec drift — malformed specs/changes, >500-char requirement bodies,
# unsynced deltas — fails CI instead of landing on main. The CLI is
# pinned to the exact version used locally.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: >-
          npm install -g --ignore-scripts --no-audit --no-fund
          @fission-ai/openspec@1.14.3

      - run: openspec validate --all --strict
