# Repository settings managed via the Probot Settings app
# (https://probot.github.io/apps/settings/). These take effect only if the
# app is installed on this repository; otherwise this file documents the
# intended configuration.

repository:
  # Only allow squash merging pull requests
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false

branches:
  - name: main
    protection:
      # Block force pushes and deletions on main, enforced for admins too.
      allow_force_pushes: false
      allow_deletions: false
      enforce_admins: true
      # Staging-first gate: production may only receive code already
      # merged into `staging` — see workflows/require-staging.yml and
      # AGENTS.md "Git workflow — staging-first".
      required_status_checks:
        strict: false
        contexts:
          - staging-first

  # Integration branch for the staging-first workflow — PRs
  # squash-merge here on green; the post-release reset force-pushes
  # it back to `main` (admins / the Promote-to-main workflow).
  - name: staging
    protection:
      required_status_checks: null
      allow_force_pushes: true
      allow_deletions: false
